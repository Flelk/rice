# fuzzel: colors come from ~/.local/bin/theme (SUPER + T)

[main]
include=~/.cache/theme/fuzzel.ini
font=JetBrainsMono Nerd Font:size=13
prompt="› "
placeholder=search
icons-enabled=no
show-actions=no
terminal=kitty -e
layer=overlay
anchor=center
width=38
lines=8
horizontal-pad=19
vertical-pad=14
inner-pad=10
line-height=26

[border]
width=1
radius=4
selection-radius=4
