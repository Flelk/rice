# fuzzel: same palette as eww/kitty/hypr
#   bg #0e0e0e  fg #d0d0d0  dim #555555  line #2a2a2a

[main]
font=JetBrainsMono Nerd Font:size=13
prompt="› "
placeholder=search
icons-enabled=no
show-actions=no
terminal=kitty -e
layer=overlay
anchor=center
width=38
lines=8
horizontal-pad=19
vertical-pad=14
inner-pad=10
line-height=26

[colors]
background=0e0e0eeb
text=555555ff
prompt=555555ff
placeholder=3a3a3aff
input=d0d0d0ff
match=d0d0d0ff
selection=1a1a1aff
selection-text=ffffffff
selection-match=ffffffff
border=2a2a2aff

[border]
width=1
radius=4
selection-radius=4
