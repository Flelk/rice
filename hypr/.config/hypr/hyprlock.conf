# Lockscreen, layout based on Mon4sm/monasm-dots

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    path = $HOME/dotfiles/wallpapers/stairs.png
    blur_size = 5
    blur_passes = 1
    brightness = 0.7
}

# == greeting (stacked for the offset shadow effect) ==
label {
    text = Welcome back, $USER
    color = rgba(0, 0, 0, 1.0)
    font_size = 50
    font_family = JetBrainsMono Nerd Font
    position = 6, 344
    halign = center
    valign = center
}

label {
    text = Welcome back, $USER
    color = rgba(69, 118, 255, 1.0)
    font_size = 50
    font_family = JetBrainsMono Nerd Font
    position = 3, 347
    halign = center
    valign = center
}

label {
    text = Welcome back, $USER
    color = rgba(220, 220, 220, 1.0)
    font_size = 50
    font_family = JetBrainsMono Nerd Font
    position = 0, 350
    halign = center
    valign = center
}

# == profile picture (placeholder "F") ==
shape {
    size = 185, 185
    color = rgba(30, 30, 30, 0.9)
    rounding = -1
    border_size = 7
    border_color = rgba(21, 21, 21, 0.6)
    position = 0, 100
    halign = center
    valign = center
}

label {
    text = F
    color = rgba(220, 220, 220, 1.0)
    font_size = 80
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}

label {
    text = $USER
    color = rgba(200, 200, 200, 1.0)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign = center
    valign = center
    shadow_passes = 5
    shadow_size = 10
}

# == password ==
input-field {
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = rgb(15, 15, 15)
    inner_color = rgba(200, 200, 200, 0.7)
    font_color = rgb(10, 10, 10)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    placeholder_text = <i>Password</i>
    hide_input = false
    rounding = -1
    check_color = rgb(204, 136, 34)
    fail_color = rgb(204, 34, 34)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = -1
    position = 0, -100
    halign = center
    valign = center
}

# == clock + date (bottom right) ==
label {
    text = $TIME12
    color = rgba(200, 200, 200, 1.0)
    font_size = 55
    font_family = JetBrainsMono Nerd Font
    position = -50, 110
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

label {
    text = cmd[update:60000] date +"%A, %B %d, %Y"
    color = rgba(200, 200, 200, 1.0)
    font_size = 25
    font_family = JetBrainsMono Nerd Font
    position = -50, 40
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

# == now playing pill (bottom left) ==
shape {
    size = 321, 30
    color = rgba(0, 0, 0, 0.4)
    rounding = 8
    position = 55, 35
    halign = left
    valign = bottom
}

shape {
    size = 5, 20
    color = rgba(255, 51, 105, 1.0)
    rounding = 1
    position = 55, 40
    halign = left
    valign = bottom
}

label {
    text = cmd[update:2000] t=$(playerctl metadata --format '{{ artist }} - {{ title }}' 2>/dev/null | cut -c1-34); echo "${t:-Nothing playing}"
    color = rgba(240, 151, 175, 1.0)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 65, 42
    halign = left
    valign = bottom
}
