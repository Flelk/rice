# Idle: Screensaver 2.5m, Lock 5m

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    ignore_dbus_inhibit = true
}

# Joke Screensaver:
listener {
    timeout = 150
    on-timeout = ~/.config/hypr/screensaver/screensaver.sh start
    on-resume = ~/.config/hypr/screensaver/screensaver.sh stop
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}
